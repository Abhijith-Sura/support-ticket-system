services:
  - type: web
    name: helpdesk-pro
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AUTO_SEED
        value: "true"
      - key: CORS_ORIGIN
        value: "*"
